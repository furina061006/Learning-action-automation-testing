      with:
          # 执行你的脚本
          command_line: ./exercises/exercise-4/.bash
          # 指定期望输出的文件路径
          assert_file_path: ./exercises/exercise-4/answer.txt
          # 期望结果是 'PASSED'，即两者相等
          expected_result: PASSED

    - name: exercise-5
      continue-on-error: true
      uses: GuillaumeFalourd/assert-command-line-output@v2.4
      with:
          # 执行你的脚本
          command_line: ./exercises/exercise-5/.bash
          # 指定期望输出的文件路径
          assert_file_path: ./exercises/exercise-5/answer.txt
