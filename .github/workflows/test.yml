name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
        
    - name: exercise-1
      continue-on-error: true
      uses: GuillaumeFalourd/assert-command-line-output@v2.4
      with:
          # 执行你的脚本
          command_line: ./exercises/exercise-1/.bash
          # 指定期望输出的文件路径
          assert_file_path: ./exercises/exercise-1/answer.txt
          # 期望结果是 'PASSED'，即两者相等
          expected_result: PASSED
        
    - name: exercise-2
      continue-on-error: true
      uses: GuillaumeFalourd/assert-command-line-output@v2.4
      with:
          # 执行你的脚本
