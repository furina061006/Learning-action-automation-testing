name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # 1. 检出代码
    - name: 检出代码
      uses: actions/checkout@v4

    # 2. 赋予执行权限（所有子目录下的 .bash 文件）
    - name: 赋予脚本执行权限
      run: chmod +x ./exercises/*/.bash

    # ========== 5 个练习依次测试 ==========
    - name: 测试 exercise-1
      id: ex1
      continue-on-error: true
      uses: GuillaumeFalourd/assert-command-line-output@v2.4
      with:
          # 先 cd 进入子目录，再执行脚本
          command_line: cd ./exercises/exercise-1/ && ./.bash
          # 此时 answer.txt 就在当前目录下
          assert_file_path: ./answer.txt
          expected_result: PASSED

    - name: 测试 exercise-2
      id: ex2
      continue-on-error: true
      uses: GuillaumeFalourd/assert-command-line-output@v2.4
      with:
          command_line: cd ./exercises/exercise-2/ && ./.bash
          assert_file_path: ./answer.txt
          expected_result: PASSED

    - name: 测试 exercise-3
      id: ex3
      continue-on-error: true
      uses: GuillaumeFalourd/assert-command-line-output@v2.4
      with:
          command_line: cd ./exercises/exercise-3/ && ./.bash
          assert_file_path: ./answer.txt
          expected_result: PASSED

    - name: 测试 exercise-4
      id: ex4
      continue-on-error: true
      uses: GuillaumeFalourd/assert-command-line-output@v2.4
      with:
          command_line: cd ./exercises/exercise-4/ && ./.bash
          assert_file_path: ./answer.txt
          expected_result: PASSED

    - name: 测试 exercise-5
      id: ex5
      continue-on-error: true
      uses: GuillaumeFalourd/assert-command-line-output@v2.4
      with:
          command_line: cd ./exercises/exercise-5/ && ./.bash
          assert_file_path: ./answer.txt
          expected_result: PASSED

    # ========== 计分与报告 ==========
    - name: 计算总分并输出结果
      id: scoring
      if: always()
      run: |
        SCORE=0
        PASSED_COUNT=0
        
        if [ "${{ steps.ex1.outcome }}" == "success" ]; then 
          PASSED_COUNT=$((PASSED_COUNT+1))
          echo "✅ exercise-1 通过"
        else 
          echo "❌ exercise-1 失败"
        fi
        
        if [ "${{ steps.ex2.outcome }}" == "success" ]; then 
          PASSED_COUNT=$((PASSED_COUNT+1))
          echo "✅ exercise-2 通过"
        else 
          echo "❌ exercise-2 失败"
        fi
        
        if [ "${{ steps.ex3.outcome }}" == "success" ]; then 
          PASSED_COUNT=$((PASSED_COUNT+1))
          echo "✅ exercise-3 通过"
        else 
          echo "❌ exercise-3 失败"
        fi
        
        if [ "${{ steps.ex4.outcome }}" == "success" ]; then 
          PASSED_COUNT=$((PASSED_COUNT+1))
          echo "✅ exercise-4 通过"
        else 
          echo "❌ exercise-4 失败"
        fi
        
        if [ "${{ steps.ex5.outcome }}" == "success" ]; then 
          PASSED_COUNT=$((PASSED_COUNT+1))
          echo "✅ exercise-5 通过"
        else 
          echo "❌ exercise-5 失败"
        fi
        
        SCORE=$((PASSED_COUNT * 20))
        
        echo "=========================================="
        echo "📊 最终得分：$SCORE / 100"
        echo "通过题数：$PASSED_COUNT / 5"
        echo "=========================================="
        
        echo "## 📊 面试题评分结果" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| 指标 | 结果 |" >> $GITHUB_STEP_SUMMARY
        echo "|------|------|" >> $GITHUB_STEP_SUMMARY
        echo "| 通过题数 | $PASSED_COUNT / 5 |" >> $GITHUB_STEP_SUMMARY
        echo "| 最终得分 | **$SCORE / 100** |" >> $GITHUB_STEP_SUMMARY
        